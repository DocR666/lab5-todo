# Lab 5 - Todo API configuration
#
# ===== STUDENT TODO =====
# Point these three lines at YOUR PostgreSQL server before building the WAR.
# Each value is ${ENV_VAR:default} — if the environment variable is unset
# (true for a plain `mvn` build on bare metal), the part after the colon is
# used instead. That means:
#   - Bare metal (Lab 5): just edit the default after the colon directly.
#   - Docker (Lab 6): leave the defaults as-is and set the env var in
#     docker-compose.yml instead — no need to touch this file at all.
# host/port: wherever your PostgreSQL instance runs (localhost if it's on
#            the same machine as Tomcat, otherwise your DB server's address)
# database:  the name you created (see README section 1)
# username / password: the role you created for this database
# =========================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tododb}
spring.datasource.username=${DB_USER:todouser}
spring.datasource.password=${DB_PASSWORD:TodoPass123!}
spring.datasource.driver-class-name=org.postgresql.Driver

# Preserve existing table records across restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Allow data.sql to run after Hibernate creates/updates the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
